version: '0.1'

name: vivadzen

services:
  nginx:
    build:
      context: .docker/dev/nginx
      dockerfile: Dockerfile
    volumes:
      - ./src/api/public:/var/www/html/public:ro
      - .docker/dev/nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - .docker/dev/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    container_name: vivadzen_nginx
    hostname: nginx
    ports:
      - "9001:9000"
    networks:
      - api
    depends_on:
      # - api
      - dashboard

  libretranslate:
    image: libretranslate/libretranslate
    container_name: libretranslate
    ports:
      - "5001:5000"
    restart: unless-stopped
    environment:
      - LT_LOAD_ONLY=ru,en,uk
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    networks:
      - api

  dashboard:
    build:
      dockerfile: .docker/dev/dashboard/Dockerfile
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY}
        IMAGE_TAG: ${IMAGE_TAG}
        MY_USER: ${MY_USER}
        MY_UID: ${MY_UID}
    volumes:
      - ./src/api:/var/www/html
    container_name: vivadzen_dashboard
    hostname: dashboard
    ports:
      - "9000:9000"
    networks:
      - api
    restart: unless-stopped
    depends_on:
      - mysql
    working_dir: /var/www/html

  api:
    build:
      dockerfile: .docker/dev/api/Dockerfile
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY}
        IMAGE_TAG: ${IMAGE_TAG}
        MY_USER: ${MY_USER}
        MY_UID: ${MY_UID}
    volumes:
      - ./src/api:/var/www/html
    container_name: vivadzen_api
    hostname: api.local
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - api
    # restart: unless-stopped
    depends_on:
      - mysql
    working_dir: /var/www/html


  proxy:
    build:
      dockerfile: .docker/dev/proxy/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
    deploy:
      replicas: 1
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - api

  tg:
    build:
      context: .
      dockerfile: .docker/dev/tg/Dockerfile
    container_name: vivadzen_tg
    hostname: tg
    ports:
      - "3001:3000"
    env_file:
      - ./src/tg/.env
    environment:
      NODE_ENV: development
      NUXT_PUBLIC_SITE_URL: http://localhost:3001
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api
      NUXT_PUBLIC_STOREFRONT_CODE: telegram
      CHOKIDAR_USEPOLLING: "true"
      NUXT_TELEMETRY_DISABLED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/tg:/workspace/src/tg
      - ./src/front:/workspace/src/front
      - tg_node_modules:/workspace/src/tg/node_modules
      - tg_nuxt:/workspace/src/tg/.nuxt
    networks:
      - api
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────
  # new-kratom: FrankenPHP + Laravel Octane (worker mode).
  # Laravel загружается один раз и обслуживает все запросы из памяти
  # → 5-10× быстрее vs php-fpm. Caddy внутри FrankenPHP отдаёт статику
  # с Brotli/HTTP/3. Фронт читает ТОЛЬКО из Redis (Repository pattern).
  # ────────────────────────────────────────────────────────────────────
  new-kratom:
    build:
      context: .
      dockerfile: .docker/dev/new-kratom/Dockerfile
    container_name: vivadzen_new_kratom
    hostname: new-kratom
    ports:
      - "8002:8000"
    environment:
      APP_URL: http://localhost:8002
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: kratom
      DB_USERNAME: kratom
      DB_PASSWORD: kratom_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      OCTANE_SERVER: frankenphp
    volumes:
      - ./src/new-kratom/app:/var/www/html
      - new_kratom_vendor:/var/www/html/vendor
      - new_kratom_node_modules:/var/www/html/node_modules
    working_dir: /var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - api
    restart: unless-stopped
    depends_on:
      - mysql
      - redis

  # Vite dev-сервер для HMR. В prod build статика собирается в /public/build
  # и отдаётся напрямую Caddy → ноды в prod не нужно.
  new-kratom-vite:
    image: node:22-alpine
    container_name: vivadzen_new_kratom_vite
    hostname: new-kratom-vite
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_DEV_SERVER_HOST: localhost
      VITE_DEV_SERVER_PORT: "5173"
    volumes:
      - ./src/new-kratom/app:/var/www/html
      - new_kratom_node_modules:/var/www/html/node_modules
    command: >
      sh -lc '
        npm install &&
        npm run dev -- --host 0.0.0.0 --port 5173
      '
    depends_on:
      - new-kratom
    networks:
      - api
    restart: unless-stopped

  # Horizon worker — фоновые задачи (создание заказов, прогрев Redis,
  # генерация AVIF/WebP, email). Тот же codebase + ENV что у фронта.
  new-kratom-horizon:
    build:
      context: .
      dockerfile: .docker/dev/new-kratom-horizon/Dockerfile
    container_name: vivadzen_new_kratom_horizon
    hostname: new-kratom-horizon
    environment:
      APP_URL: http://localhost:8002
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: kratom
      DB_USERNAME: kratom
      DB_PASSWORD: kratom_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./src/new-kratom/app:/var/www/html
      - new_kratom_vendor:/var/www/html/vendor
    working_dir: /var/www/html
    networks:
      - api
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - new-kratom

  # Nuxt 4 admin — отдельный SPA с собственным контейнером.
  # Ходит в Laravel admin API (/admin-api/*) на той же сети.
  new-kratom-admin:
    build:
      context: .
      dockerfile: .docker/dev/new-kratom-admin/Dockerfile
    container_name: vivadzen_new_kratom_admin
    hostname: new-kratom-admin
    ports:
      - "3002:3000"
    working_dir: /app
    environment:
      NODE_ENV: development
      NUXT_PUBLIC_API_BASE: http://localhost:8002/admin-api
      NUXT_PUBLIC_SITE_BASE: http://localhost:8002
      CHOKIDAR_USEPOLLING: "true"
      NUXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./src/new-kratom-admin:/app
      - new_kratom_admin_node_modules:/app/node_modules
      - new_kratom_admin_nuxt:/app/.nuxt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - api
    restart: unless-stopped
    depends_on:
      - new-kratom

  mysql:
    build:
      dockerfile: .docker/dev/mysql/Dockerfile
    container_name: vivadzen_mysql
    hostname: mysql
    tty: true
    ports: 
        - "3307:3306"
    volumes:
        - ./mysql/lib:/var/lib/mysql
        - ./mysql/logs:/var/log/mysql
        - ./mysql/dumps:/var/dumps
        # init-скрипты выполняются только при создании пустого data-dir
        - ./.docker/dev/mysql/init:/docker-entrypoint-initdb.d:ro
    environment: 
        MYSQL_DATABASE: ${DB_DATABASE}
        MYSQL_USER: ${DB_USERNAME}
        MYSQL_PASSWORD: ${DB_PASSWORD}
        MYSQL_ROOT_PASSWORD: root
        SERVICE_TAGS: dev
        SERVICE_NAME: mysql
    networks:
      - api
    restart: unless-stopped

  phpmyadmin:
    build:
      dockerfile: .docker/dev/phpmyadmin/Dockerfile
    restart: always
    container_name: vivadzen_phpmyadmin
    hostname: phpmyadmin
    ports:
      - 8080:80
    environment:
      PMA_HOST: mysql
      PMA_ARBITRARY: 1
    networks:
      - api
    depends_on:
      - mysql
  
  redis:
    build:
      dockerfile: .docker/dev/redis/Dockerfile
    volumes:
      - redis:/data
    ports:
      - "6379:6379"
    networks:
      - api

  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    container_name: vivadzen_soketi
    ports:
      - "6001:6001"
    environment:
      SOKETI_HOST: 0.0.0.0
      SOKETI_PORT: 6001
      SOKETI_DEBUG: 1
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-local}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-local}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-local}
    networks:
      - api
    restart: unless-stopped

  queue:
    build:
      dockerfile: .docker/dev/queue/Dockerfile
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY}
        IMAGE_TAG: ${IMAGE_TAG}
    profiles: ["legacy-queue"]
    volumes:
      - ./src/api:/var/www/html
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_started
      meilisearch:
        condition: service_started
    networks:
      - api
    restart: always

  horizon:
    build:
      dockerfile: .docker/dev/queue/Dockerfile
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY}
        IMAGE_TAG: ${IMAGE_TAG}
    command: ["php", "artisan", "horizon"]
    volumes:
      - ./src/api:/var/www/html
    container_name: vivadzen_horizon
    hostname: horizon
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_started
      meilisearch:
        condition: service_started
    networks:
      - api
    restart: unless-stopped

  schedule:
    build:
      dockerfile: .docker/dev/schedule/Dockerfile
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY}
        IMAGE_TAG: ${IMAGE_TAG}
    volumes:
      - ./src/api:/var/www/html
    depends_on:
      - redis
      - mysql
    networks:
      - api
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_ENV: "development"
    ports: ["7700:7700"]
    volumes:
      - meili_data:/meili_data
    networks:
      - api
    restart: unless-stopped

      
volumes:
  meili_data:

  new_kratom_node_modules:

  new_kratom_vendor:

  new_kratom_admin_node_modules:

  new_kratom_admin_nuxt:

  tg_node_modules:

  tg_nuxt:

  backups:
    driver: local
    
  mysql:
    driver: local

  redis:
    driver: local
  
  libretranslate_models:
    driver: local

networks:
  api:
    name: api
    driver: bridge

  nginx:
    name: nginx
    driver: bridge

# Permanent redirect from legacy Czech domains to the canonical domain.
server {
    listen 80;
    listen [::]:80;

    server_name vivadzen.cz www.vivadzen.cz;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri $uri/ =404;
    }

    location / {
        return 301 https://vivadzen.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name vivadzen.cz www.vivadzen.cz;

    ssl_certificate /etc/nginx/ssl/live/api.vivadzen.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/api.vivadzen.com/privkey.pem;

    include /etc/nginx/snippets/ssl.conf;

    return 301 https://vivadzen.com$request_uri;
}

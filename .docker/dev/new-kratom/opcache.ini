[opcache]
; Для Octane критично — PHP-код мапим в shared memory один раз
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
opcache.max_wasted_percentage = 5

; В dev оставляем валидацию (revalidate_freq=0 → каждый запрос),
; но это не больно благодаря OS-кешу. В prod выставить validate_timestamps=0.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; JIT — только tracing для долгоживущих процессов Octane
opcache.jit_buffer_size = 128M
opcache.jit = tracing

; Preload Laravel-классов для ещё большего ускорения boot (закомменчено, требует preload.php)
; opcache.preload = /var/www/html/storage/app/preload.php
; opcache.preload_user = www-data

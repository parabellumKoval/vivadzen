      - heading "Условия возврата товара" [level=1] [ref=e51]
      - generic [ref=e52]:
        - heading "Отказ от договора" [level=2] [ref=e53]
        - list [ref=e54]:
          - listitem [ref=e55]: Покупатель, заключивший договор купли-продажи вне своей предпринимательской деятельности как потребитель, имеет право отказаться от договора.
          - listitem [ref=e56]: Срок отказа составляет 14 дней со дня получения товара.
          - listitem [ref=e57]:
            - text: "Покупатель не может отказаться от договора купли-продажи, если:"
            - list [ref=e58]:
              - listitem [ref=e59]: оказание услуги началось с его предварительного явного согласия до истечения срока отказа, и продавец заранее сообщил, что в таком случае право на отказ утрачивается;
              - listitem [ref=e60]: цена товара или услуги зависит от колебаний на финансовом рынке, которые не поддаются контролю продавца в течение срока отказа;
              - listitem [ref=e61]: поставляются алкогольные напитки, которые могут быть доставлены по истечении 30 дней и цена которых зависит от колебаний финансового рынка, не зависящих от продавца;
              - listitem [ref=e62]: товар был изготовлен по индивидуальному заказу покупателя или явно персонализирован;
              - listitem [ref=e63]: поставляются скоропортящиеся товары или товары, которые после доставки были безвозвратно смешаны с другими;
              - listitem [ref=e64]: поставляется товар в герметичной упаковке, который по соображениям гигиены и санитарии не подлежит возврату и был распечатан покупателем;
              - listitem [ref=e65]: поставляются аудио- или видеозаписи либо программное обеспечение с повреждённой оригинальной упаковкой;
              - listitem [ref=e66]: поставляются газеты, периодические издания или журналы;
              - listitem [ref=e67]: поставляется цифровой контент, не записанный на материальном носителе, по явному согласию покупателя до окончания срока отказа и после уведомления о потере права на отказ;
              - listitem [ref=e68]: действуют иные случаи, предусмотренные статьёй 1837 Гражданского кодекса.
          - listitem [ref=e69]: Чтобы соблюсти срок отказа, покупатель должен отправить уведомление об отказе до его истечения.
          - listitem [ref=e70]: Для отказа от договора купли-продажи покупатель может воспользоваться формой, предоставленной продавцом, и отправить её на электронный или почтовый адрес, указанный в настоящих Условиях; продавец обязан незамедлительно подтвердить получение.
          - listitem [ref=e71]: Покупатель, отказавшийся от договора, обязан вернуть товар продавцу в течение 14 дней с момента отказа и несёт расходы по возврату, даже если товар невозможно отправить обычной почтой ввиду его особенностей.
          - listitem [ref=e72]: При отказе покупателя от договора продавец обязан без неоправданной задержки, но не позднее 14 дней с момента уведомления, вернуть все полученные платежи, включая стоимость доставки, тем же способом оплаты, если только покупатель не согласится на иной способ без дополнительных расходов.
          - listitem [ref=e73]: Если покупатель выбрал способ доставки дороже, чем самый экономичный вариант продавца, продавец возмещает расходы на доставку лишь в размере стоимости этого самого дешёвого варианта.
          - listitem [ref=e74]: Продавец не обязан возвращать деньги до тех пор, пока товар не будет получен обратно или пока покупатель не предоставит доказательство отправки.
          - listitem [ref=e75]: Покупатель обязан вернуть товар невредимым, неношеным, чистым и, по возможности, в оригинальной упаковке; продавец вправе зачесть требование о возмещении ущерба в счёт суммы возврата.
          - listitem [ref=e76]: Продавец вправе отказаться от договора купли-продажи в случае отсутствия товара на складе, недоступности товара или прекращения его производства либо импорта производителем, импортёром или поставщиком; он обязан немедленно уведомить об этом покупателя и вернуть все полученные средства, включая стоимость доставки, в течение 14 дней тем же способом либо другим согласованным способом.
